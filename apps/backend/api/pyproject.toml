[project]
name = "api"
version = "0.1.0"
description = "API layer to communicate with backend services"
readme = "README.md"
requires-python = ">=3.12.10"
dependencies = [
    "proto-utils",
    "messaging-utils",
    "aio-pika>=9.5.5",
    "alembic>=1.18.4",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.116.1",
    "jsonschema>=4.24.0",
    "motor>=3.7.1",
    "passlib>=1.7.4",
    "pika>=1.3.2",
    "psycopg>=3.2.9",
    "psycopg2-binary>=2.9.10",
    "pydantic-settings>=2.10.0",
    "sqlalchemy>=2.0.45",
    "tenacity>=9.1.2",
    "jwcrypto>=1.5.6",
    "bcrypt>=5.0.0",
    "pyaegis>=0.2.0",
    "python-json-logger>=4.0.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "opentelemetry-sdk>=1.40.0",
    "opentelemetry-exporter-otlp-proto-http>=1.40.0",
    "httpx[http2]>=0.28.1",
]

[tool.uv.sources]
proto-utils = { path = "../../../packages/proto-utils/proto-utils-py", editable = true }
messaging-utils = { path = "../../../packages/messaging-utils/messaging-utils-py", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.13.0",
]

[tool.ruff]
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".venv"
]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
