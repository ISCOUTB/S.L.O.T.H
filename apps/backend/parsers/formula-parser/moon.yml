project:
    name: formula-parser
    description: |
        A Node.js gRPC service that parses Excel formulas into 
        Abstract Syntax Trees (AST) and token representations.

layer: application

language: typescript

tasks:
    test:
        command: node
        args:
            - --env-file=.env
            - node_modules/vitest/vitest.mjs
            - --run
            - --coverage
        deps:
            - proto-utils-js:build
        toolchains: node

    pnpm:
        command: pnpm
        args:
            - --filter
            - "@etl-design/apps-formula-parser"
        toolchains: node
        options:
            runFromWorkspaceRoot: true
            cache: false

    lint:
        command: npx
        args:
            - eslint
            - .
            - --fix
        toolchains: node

    run:
        command: node
        args:
            - --env-file=.env
            - dist/server.cjs
        deps:
            - formula-parser:build
        toolchains: node
        preset: server

    build:
        command: npx
        args:
            - tsup
        deps:
            - proto-utils-js:build
        toolchains: node
        options:
            runFromWorkspaceRoot: false

    docker-build:
        command: docker
        args:
            - build
            - -f
            - apps/backend/parsers/formula-parser/Dockerfile
            - .
        toolchains: system
        options:
            runFromWorkspaceRoot: true
            cache: false
            interactive: false
            runInCI: always
