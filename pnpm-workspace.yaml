preferSymlinkedExecutables: true
linkWorkspacePackages: true
injectWorkspacePackages: true

packages:
    - apps/**/*
    - packages/**/*
    - tools/**/*

minimumReleaseAgeExclude:
    - "@eslint/plugin-kit@0.7.2"
    - eslint@10.4.1

allowBuilds:
    "@parcel/watcher": true
    esbuild: true
    grpc-tools: true
    protobufjs: true
    sharp: true
    unrs-resolver: true
    vue-demi: true
